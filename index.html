<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1F3864">
<title>Painel PPCP</title>
<style>
:root{--bg:#eef2f7;--card:#fff;--txt:#1f2933;--mut:#5f6b7a;--line:#d9e0ea}
@media (prefers-color-scheme: dark){
:root:not([data-tema="claro"]){--bg:#0f1722;--card:#17212e;--txt:#e6ebf2;--mut:#9aa8ba;--line:#2a3748}
}
:root[data-tema="escuro"]{--bg:#0f1722;--card:#17212e;--txt:#e6ebf2;--mut:#9aa8ba;--line:#2a3748}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
.c{width:100%;max-width:380px;background:var(--card);border-radius:14px;box-shadow:0 2px 10px rgba(16,24,40,.12);overflow:hidden}
.c h1{margin:0;background:#1F3864;color:#fff;font-size:18px;padding:16px 20px}
.c form{padding:18px 20px 22px}
.c p{margin:0 0 12px;color:var(--mut);font-size:13px}
input[type=password]{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px 12px;font:inherit;background:var(--card);color:var(--txt)}
label.l{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mut);margin:12px 0}
button{width:100%;appearance:none;border:0;border-radius:8px;background:#2F75B5;color:#fff;font:inherit;font-weight:700;padding:11px;cursor:pointer}
button:disabled{opacity:.6}
#e{color:#C00000;font-size:13px;font-weight:600;min-height:20px;margin-top:10px}
button.tema{position:fixed;top:12px;right:12px;width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--card);color:var(--txt);border:1px solid var(--line);box-shadow:0 1px 4px rgba(16,24,40,.15)}
button.tema:focus-visible{outline:2px solid #2F75B5;outline-offset:2px}
</style>
<script>
(function(){
  var K = "ppcp_tema", R = document.documentElement;
  var LUA = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  var SOL = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  function salvo(){ try { var v = localStorage.getItem(K); return v === "claro" || v === "escuro" ? v : ""; } catch(e){ return ""; } }
  function guardar(v){ try { localStorage.setItem(K, v); } catch(e){} }
  function sistemaEscuro(){ return !!(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches); }
  function aplicar(t){
    if (t){ R.setAttribute("data-tema", t); R.style.colorScheme = t === "escuro" ? "dark" : "light"; }
    else { R.removeAttribute("data-tema"); R.style.colorScheme = ""; }
  }
  function escuro(){ var t = R.getAttribute("data-tema"); return t ? t === "escuro" : sistemaEscuro(); }
  function rotular(){
    var b = document.getElementById("tema"); if (!b) return;
    var e = escuro(), m = e ? "Mudar para o tema claro" : "Mudar para o tema escuro";
    b.innerHTML = e ? SOL : LUA; b.title = m; b.setAttribute("aria-label", m);
  }
  aplicar(salvo());
  document.addEventListener("DOMContentLoaded", function(){
    var b = document.getElementById("tema"); if (!b) return;
    b.addEventListener("click", function(){ var t = escuro() ? "claro" : "escuro"; aplicar(t); guardar(t); rotular(); });
    rotular();
  });
  if (window.matchMedia){ var mq = matchMedia("(prefers-color-scheme: dark)"); if (mq.addEventListener) mq.addEventListener("change", rotular); else if (mq.addListener) mq.addListener(rotular); }
})();
</script>
</head>

<button type="button" class="tema" id="tema"></button>
<div class="c"><h1>PAINEL PPCP</h1>
<form id="f" autocomplete="off"><p>Conteúdo protegido. Digite a senha para abrir.</p>

<label class="l"><input type="checkbox" id="m" checked> Lembrar neste aparelho</label>
<button id="b" type="button">Entrar</button><div id="e"></div></form></div>

var el = function(i){ return document.getElementById(i); };
var b64 = function(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); };
function lerSalva(){ try { return localStorage.getItem("ppcp_pw") || ""; } catch(e){ return ""; } }
function guardar(v){ try { if (v) localStorage.setItem("ppcp_pw", v); else localStorage.removeItem("ppcp_pw"); } catch(e){} }
async function abrir(senha){
  var km = await crypto.subtle.importKey("raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveKey"]);
  var k = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(P.salt), iterations:P.it, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(P.iv)}, k, b64(P.ct)));
}
async function entrar(senha, lembrar){
  if (!window.crypto || !crypto.subtle){ el("e").textContent = "Este navegador não permite abrir o conteúdo. Use o endereço https do site."; return false; }
  try { var html = await abrir(senha); } catch(e){ return false; }
  window.__PPCP_PW = senha;
  if (lembrar) guardar(senha);
  document.open(); document.write(html); document.close();
  return true;
}
async function tentar(){   // botão e Enter, sem depender do envio de formulário (alguns visualizadores bloqueiam)
  var s = el("s").value; if (!s || el("b").disabled) return;
  el("b").disabled = true; el("e").textContent = "";
  var ok = await entrar(s, el("m").checked);
  if (!ok){ el("e").textContent = el("e").textContent || "Senha incorreta."; el("b").disabled = false; el("s").select(); }
}
el("f").addEventListener("submit", function(ev){ ev.preventDefault(); tentar(); });
el("b").addEventListener("click", tentar);
el("s").addEventListener("keydown", function(ev){ if (ev.key === "Enter"){ ev.preventDefault(); tentar(); } });
var salva = lerSalva();
if (salva){ entrar(salva, true).then(function(ok){ if (!ok){ guardar(""); } }); }
})();
</script>
